# Example venue config. Copy to configs/<venue_id>.yaml (git-ignored).
venue_id: example_cafe
timezone: Europe/Dublin

# Optional: areas for venues with more than one floor or room (a terrace, an
# upstairs). Leave it out for a single room. Each table takes its camera's area
# unless it sets its own `area:`. step_free: false = reached only by stairs.
# areas:
#   - id: ground
#     name: Ground floor
#   - id: first
#     name: First floor
#     step_free: false

cameras:
  - id: cam_floor_1
    source: data/sample.mp4          # or rtsp://user:pass@192.168.1.20:554/stream1
    # live: true                     # set by Start/Stop in the web app's Cameras screen
    fps: 3                           # frames processed per second
    imgsz: 1280                      # 640 for near cameras; 1280 for high/wide ones (see eval/results)
    tiles: 1                         # 3 for far, crowded rooms (with fps: 1); slow, see eval/results/2026-11-10_tiled_detection.md
    # area: ground                   # with areas: the area this camera looks at

tables:
  - id: T1
    camera: cam_floor_1
    seats: 4
    polygon: [[120, 340], [310, 330], [330, 470], [100, 480]]   # pixel coords
  - id: T2
    camera: cam_floor_1
    seats: 2
    polygon: [[400, 300], [540, 295], [555, 400], [390, 405]]

# State machine thresholds in seconds (docs/04-state-machine.md). Tune per venue.
timers:
  t_seat: 45
  t_gone: 20
  t_return: 5
  t_away: 240
  clearing_visit_min: 10
  clearing_visit_max: 90
  t_clear_assume: 1200
  max_gap: 10