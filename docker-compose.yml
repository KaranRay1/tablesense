# TableSense on a venue box: `docker compose up -d`, then open http://<box-ip>:8765
#
# Before the first start:
#   1. cp .env.example .env and set TABLESENSE_OWNER_PASSWORD and TABLESENSE_STAFF_PIN
#      (the dashboard refuses to open to the network without them), plus alert settings.
#   2. Put your venue config at configs/venue.yaml (copy configs/example_venue.yaml).
#
# Both services restart on their own after a crash or a reboot (Docker must be
# set to start at boot, which is the default on Linux).
#
# Try it with synthetic data instead:   docker compose --profile demo up demo
# Add the camera pipeline:               docker compose --profile camera up -d

services:
  dashboard:
    build: { context: ., target: dashboard }
    image: tablesense-dashboard
    restart: unless-stopped
    env_file: .env
    command: >
      --events /app/data/events.db --config /app/configs/venue.yaml
      --host 0.0.0.0 --port 8765 --notify push --unserved-min 5
    ports: ["8765:8765"]
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro

  pipeline:
    profiles: [camera]
    build: { context: ., target: pipeline }
    image: tablesense-pipeline
    restart: unless-stopped
    env_file: .env
    command: >
      --config /app/configs/venue.yaml --events /app/data/events.db
      --model /app/models/yolo11s.pt
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./models:/app/models

  # Three weeks of synthetic history and a fast clock, to try the app. Needs
  # TABLESENSE_OWNER_PASSWORD in .env like the real thing; sends nothing.
  demo:
    profiles: [demo]
    build: { context: ., target: dashboard }
    image: tablesense-dashboard
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c"]
    command:
      - >
        { [ -f /tmp/demo.db ] || python -m tablesense.sim --events /tmp/demo.db --start 2026-10-12 --days 21; } &&
        exec python -m tablesense.dashboard.server --events /tmp/demo.db
        --demo-start 2026-10-31T19:30 --speed 20 --notify console --unserved-min 5
        --host 0.0.0.0 --port 8765
    ports: ["8765:8765"]
